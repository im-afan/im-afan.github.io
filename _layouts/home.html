<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$$', '$$']], displayMath: [['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 6rem;
         font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         color: #1a1a1a; background: #fff; }
  h1, h2, h3 { line-height: 1.25; margin-top: 2em; }
  h1 { margin-top: 0; margin-bottom: 0.4em; }
  h2 { margin-top: 2.5em; padding-bottom: 0.3em; border-bottom: 1px solid #eee; font-size: 1.15rem; }
  h2 + p strong { font-size: 1.02em; }
  img { max-width: 100%; display: block; margin: 1.5em auto; }
  a { color: #0b5fff; }
  pre { background: #f6f6f6; padding: 1rem; overflow-x: auto; border-radius: 4px; }
  code { font-size: 0.9em; }
  pre code { background: none; padding: 0; }
  :not(pre) > code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; }
  table { border-collapse: collapse; width: 100%; overflow-x: auto; display: block; }
  th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; }
  blockquote { border-left: 3px solid #ddd; margin-left: 0; padding-left: 1rem; color: #555; }
</style>
</head>
<body>
{{ content }}
</body>
</html>

<!DOCTYPE html> <html lang="en">
<head>
{% include head.html %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['$$', '$$']], displayMath: [['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  h1 { margin-top: 0; }
  .nav { margin: 0 0 2.5rem; font-size: 0.9rem; }
  .nav a { color: var(--muted); text-decoration: none; }
  .nav a:hover { color: var(--link); }
  /* Writeup diagrams are dark-on-white PNGs; keep a light card behind them. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) img { background: #fff; border-radius: 4px; }
  }
  :root[data-theme="dark"] img { background: #fff; border-radius: 4px; }
</style>
<script src="https://polyfill.io"></script>
<script id="MathJax-script" async src="https://jsdelivr.net"></script>
</head>
<body>
{% include theme-toggle.html %}
<p class="nav"><a href="/">← Andrew Fan</a></p>
{{ content }}
</body>
</html>
